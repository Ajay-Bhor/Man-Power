    :root {
      --navy-darkest: #071326;
      --navy-900: #0b192c;
      --navy-800: #122847;
      --navy-700: #1b3864;
      --navy-600: #23487f;
      --navy-primary: #1e40af;
      --navy-light: #3b82f6;
      --navy-accent: #0ea5e9;
      --navy-glow: rgba(14, 165, 233, 0.25);

      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-muted: #f1f5f9;
      --border-color: #e2e8f0;

      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-inverse: #f8fafc;

      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;

      --sidebar-width: 275px;
      --topbar-height: 70px;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-card: 0 8px 24px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.02);
      --shadow-lg: 0 12px 28px -4px rgba(15, 23, 42, 0.1);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .app-wrapper {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    .app-sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, var(--navy-darkest) 0%, var(--navy-900) 45%, var(--navy-800) 100%);
      color: var(--text-inverse);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 1000;
      box-shadow: 4px 0 20px rgba(7, 19, 38, 0.25);
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 1.5rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0ea5e9 0%, #1e40af 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: white;
      box-shadow: 0 4px 12px var(--navy-glow);
    }

    .brand-text h4 {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text span {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--navy-accent);
      font-weight: 700;
    }

    .sidebar-nav {
      padding: 0.85rem 0.75rem;
      flex-grow: 1;
    }

    .nav-section-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      padding: 0.75rem 0.85rem 0.35rem;
    }

    .sidebar-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.62rem 0.85rem;
      margin-bottom: 0.2rem;
      border-radius: var(--radius-sm);
      color: #94a3b8;
      background: transparent;
      border: none;
      font-size: 0.86rem;
      font-weight: 600;
      text-align: left;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .sidebar-btn i {
      font-size: 1.1rem;
      width: 22px;
      text-align: center;
    }

    .sidebar-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      transform: translateX(3px);
    }

    .sidebar-btn.active {
      color: #ffffff;
      background: linear-gradient(90deg, rgba(30, 64, 175, 0.85) 0%, rgba(14, 165, 233, 0.4) 100%);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
      font-weight: 700;
      border-left: 3px solid #38bdf8;
    }

    .sidebar-footer {
      padding: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.25);
    }

    .app-main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-page);
    }

    .app-navbar {
      height: var(--topbar-height);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 99;
    }

    .nav-role-switcher {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-pill);
      padding: 0.35rem 0.95rem;
      font-size: 0.84rem;
    }

    .nav-role-switcher select {
      border: none;
      background: transparent;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy-primary);
      outline: none;
      cursor: pointer;
    }

    .page-container {
      padding: 2rem;
      flex-grow: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-header h2 {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--navy-900);
      margin: 0;
      letter-spacing: -0.02em;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: 0.25rem 0 0;
    }

    .card-portal {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      overflow: hidden;
    }

    .card-portal:hover {
      box-shadow: var(--shadow-lg);
    }

    .card-header-portal {
      padding: 1.25rem 1.5rem;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header-portal h5 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .stat-card {
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      background: #ffffff;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .stat-card.navy::before {
      background: var(--navy-primary);
    }

    .stat-card.cyan::before {
      background: var(--navy-accent);
    }

    .stat-card.success::before {
      background: var(--color-success);
    }

    .stat-card.warning::before {
      background: var(--color-warning);
    }

    .stat-card.danger::before {
      background: var(--color-danger);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--navy-900);
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
    }

    .stat-icon.navy {
      background: #eff6ff;
      color: #1e40af;
    }

    .stat-icon.cyan {
      background: #f0f9ff;
      color: #0284c7;
    }

    .stat-icon.success {
      background: #ecfdf5;
      color: #059669;
    }

    .stat-icon.warning {
      background: #fffbeb;
      color: #d97706;
    }

    .stat-icon.danger {
      background: #fef2f2;
      color: #dc2626;
    }

      font-size: 0.76rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.02em;

    .badge-status.approved {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .badge-status.pending {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .badge-status.recruiter {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .badge-status.interviewing {
      background: #ede9fe;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }

    .badge-status.rejected {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .badge-status.critical {
      background: #ffe4e6;
      color: #be123c;
      font-weight: 800;
      border: 1px solid #fecdd3;
    }

    .tat-tracker {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 140px;
    }

    .tat-bar-container {
      height: 8px;
      background-color: #e2e8f0;
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .tat-bar-fill {
      height: 100%;
      border-radius: var(--radius-pill);
      transition: width 0.4s ease;
    }

    .tat-bar-fill.normal {
      background: linear-gradient(90deg, #10b981, #059669);
    }

    .tat-bar-fill.warning {
      background: linear-gradient(90deg, #f59e0b, #d97706);
    }

    .tat-bar-fill.overdue {
      background: linear-gradient(90deg, #ef4444, #dc2626);
    }

    .btn-navy {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      color: white;
      font-weight: 600;
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius-sm);
      border: none;
      box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2);
      transition: all 0.2s ease;
    }

    .btn-navy:hover {
      background: linear-gradient(135deg, #172554 0%, #1e3a8a 100%);
      color: white;
      transform: translateY(-1px);
    }

    .btn-outline-navy {
      border: 1.5px solid #1e40af;
      color: #1e40af;
      background: transparent;
      font-weight: 600;
      border-radius: var(--radius-sm);
      padding: 0.55rem 1.15rem;
    }

    .btn-outline-navy:hover {
      background: #1e40af;
      color: white;
    }

    .table-portal {
      width: 100%;
      margin-bottom: 0;
      border-collapse: separate;
      border-spacing: 0;
    }

    .table-portal th {
      background: #f8fafc;
      color: #475569;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.95rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .table-portal td {
      padding: 1.05rem 1.25rem;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text-main);
      font-size: 0.88rem;
    }

    .table-portal tr:hover td {
      background-color: #f8fafc;
    }

    .workflow-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 1rem 0 2rem;
    }

    .workflow-stepper::before {
      content: '';
      position: absolute;
      top: 36px;
      left: 40px;
      right: 40px;
      height: 3px;
      background: #e2e8f0;
      z-index: 1;
    }

    .step-item {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 120px;
    }

    .step-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      border: 3px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .step-item.completed .step-circle {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }

    .step-item.active .step-circle {
      background: #1e40af;
      border-color: #0ea5e9;
      color: white;
      box-shadow: 0 0 0 5px rgba(14, 165, 233, 0.2);
    }

    .step-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .step-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
  </style>
</head>

      }

      const remainingDiff = due.getTime() - now.getTime();
      const daysRemaining = Math.ceil(remainingDiff / (1000 * 60 * 60 * 24));
      const isOverdue = daysRemaining < 0;
      const progress = Math.min(100, Math.max(0, Math.round((elapsedDays / 30) * 100)));

      let label = `${daysRemaining} days left`;
      if (isOverdue) label = `OVERDUE (${Math.abs(daysRemaining)}d)`;
      else if (elapsedDays >= 20 || daysRemaining <= 7) label = `Warning (${daysRemaining}d left)`;

      return { started: true, elapsedDays, daysRemaining, isOverdue, progress, label };
    }

    function TalentPulsePortal() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [currentRoleId, setCurrentRoleId] = useState('ROLE_HR_ADMIN');
      const [currentUser, setCurrentUser] = useState(INITIAL_USERS[1]);

      const [requisitions, setRequisitions] = useState(INITIAL_REQUISITIONS);
      const [reqStatusFilter, setReqStatusFilter] = useState('ALL');
      const [filterDept, setFilterDept] = useState('ALL');
      const [filterLoc, setFilterLoc] = useState('ALL');
      const [filterStat, setFilterStat] = useState('ALL');
      const [reqSearch, setReqSearch] = useState('');
      const [reqPage, setReqPage] = useState(1);
      const [reqRowsPerPage, setReqRowsPerPage] = useState(10);
      const [selectedReqIds, setSelectedReqIds] = useState([]);

      const reqCounts = useMemo(() => {
        let open = 0, inApproval = 0, filled = 0, onHold = 0;
        requisitions.forEach(r => {
          const s = (r.status || '').toLowerCase();
          if (s === 'open') open += 1;
          else if (s === 'in approval') inApproval += 1;
          else if (s === 'filled') filled += 1;
          else if (s === 'on hold') onHold += 1;
        });
        return { all: requisitions.length, open, inApproval, filled, onHold };
      }, [requisitions]);

      const filteredRequisitions = useMemo(() => {
        return requisitions.filter(req => {
          if (reqStatusFilter === 'OPEN' && req.status !== 'Open') return false;
          if (reqStatusFilter === 'IN_APPROVAL' && req.status !== 'In Approval') return false;
          if (reqStatusFilter === 'FILLED' && req.status !== 'Filled') return false;
          if (reqStatusFilter === 'ON_HOLD' && req.status !== 'On Hold') return false;

          if (filterDept !== 'ALL' && req.deptName !== filterDept) return false;
          if (filterLoc !== 'ALL' && req.location !== filterLoc) return false;
          if (filterStat !== 'ALL' && (req.status || '').toLowerCase() !== filterStat.toLowerCase()) return false;

          if (reqSearch && reqSearch.trim()) {
            const q = reqSearch.toLowerCase().trim();
            const matchTitle = (req.title || '').toLowerCase().includes(q);
            const matchCode = (req.code || '').toLowerCase().includes(q);
            const matchDept = (req.deptName || '').toLowerCase().includes(q);
            const matchLoc = (req.location || '').toLowerCase().includes(q);
            if (!matchTitle && !matchCode && !matchDept && !matchLoc) return false;
          }
          return true;
        });
      }, [requisitions, reqStatusFilter, filterDept, filterLoc, filterStat, reqSearch]);

      const paginatedRequisitions = useMemo(() => {
        const start = (reqPage - 1) * reqRowsPerPage;
        return filteredRequisitions.slice(start, start + reqRowsPerPage);
      }, [filteredRequisitions, reqPage, reqRowsPerPage]);

      const totalReqPages = Math.ceil(filteredRequisitions.length / reqRowsPerPage) || 1;

      const handleResetFilters = () => {
        setReqStatusFilter('ALL');
        setFilterDept('ALL');
        setFilterLoc('ALL');
        setFilterStat('ALL');
        setReqSearch('');
        setReqPage(1);
        setSelectedReqIds([]);
      };

        if (approvalDecision === 'APPROVED') {
          if (selectedReqForApproval.status === 'PENDING_HR_REVIEW') nextStatus = 'PENDING_DEPT_APPROVAL';
          else if (selectedReqForApproval.status === 'PENDING_DEPT_APPROVAL') nextStatus = 'PENDING_SENIOR_APPROVAL';
          else if (selectedReqForApproval.status === 'PENDING_SENIOR_APPROVAL') nextStatus = 'APPROVED';
          else nextStatus = 'APPROVED';
        } else if (approvalDecision === 'REJECTED') {
          nextStatus = 'REJECTED';
        } else if (approvalDecision === 'RETURNED_FOR_CORRECTION') {
          nextStatus = 'RETURNED';

        setRequisitions(prev => prev.map(r => r.id === selectedReqForApproval.id ? { ...r, status: nextStatus } : r));

          actor: currentUser.name,
          action: `REQUISITION_${approvalDecision}`,

                                <span className="text-muted small">{doc.empCode}</span>
                              </td>
                              <td className="fw-bold text-navy"><i className="bi bi-file-earmark-lock-fill text-primary me-1"></i> {doc.name}</td>
                              <td><span className="badge bg-secondary-subtle text-secondary">{doc.category}</span></td>
                              <td>{doc.size}</td>
                              <td><span className="badge bg-light border text-dark">{doc.version}</span></td>
                              <td>
                                {doc.confidential ? (
                                  <span className="badge bg-danger-subtle text-danger border"><i className="bi bi-lock me-1"></i> Restricted HR</span>
                                ) : (
                                  <span className="badge bg-success-subtle text-success border">General</span>
                                )}
                              </td>
                              <td>
                                <button className="btn btn-sm btn-outline-navy" onClick={() => showToast(`Authorized token verified for: ${doc.name}`)}>
                                  <i className="bi bi-download"></i> Download
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* Module 12: Reports */}
              {activeTab === 'reports' && (
                <div>
                  <div className="page-header">
                    <div>
                      <h2>12. Reports & Analytics</h2>
                      <p>SLA compliance rate, hiring velocity, and department fulfillment metrics.</p>
                    </div>
                    <button className="btn btn-navy" onClick={() => showToast('Generated complete recruitment CSV report.')}>
                      <i className="bi bi-file-earmark-spreadsheet me-1"></i> Export Report
                    </button>
                  </div>

                  <div className="row g-4 mb-4">
                    <div className="col-md-4">
                      <div className="card-portal p-3 text-center">
                        <h3 className="fw-bold text-success">87.5%</h3>
                        <p className="text-muted mb-0">30-Day TAT SLA Compliance</p>
                      </div>
                    </div>
                    <div className="col-md-4">
                      <div className="card-portal p-3 text-center">
                        <h3 className="fw-bold text-primary">22.4 Days</h3>
                        <p className="text-muted mb-0">Average Time to Hire</p>
                      </div>
                    </div>
                    <div className="col-md-4">
                      <div className="card-portal p-3 text-center">
                        <h3 className="fw-bold text-info">92%</h3>
                        <p className="text-muted mb-0">Offer Acceptance Rate</p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Module 13: Notifications */}
              {activeTab === 'notifications' && (
                <div>
                  <div className="page-header d-flex justify-content-between align-items-center">
                    <div>
                      <h2>13. Email Notifications & Alert Center</h2>
                      <p>Automated transactional alerts, approval queues, and SLA escalation records.</p>
                    </div>
                    <div className="d-flex align-items-center gap-2">
                      <button
                        type="button"
                        className="btn btn-sm btn-outline-primary fw-semibold"
                        onClick={() => {
                          setNotifications(prev => prev.map(n => ({ ...n, unread: false, isRead: true, readStatus: 'READ' })));
                          showToast('All notifications marked as read');
                        }}
                        disabled={!notifications.some(n => n.unread)}
                      >
                        <i className="bi bi-check2-all me-1"></i> Mark All as Read
                      </button>
                    </div>
                  </div>
                  <div className="card-portal">
                    <div className="list-group list-group-flush">
                      {notifications.map(n => {
                        const isRead = !n.unread || n.isRead === true || n.readStatus === 'READ';
                        return (
                          <div
                            key={n.id}
                            className="list-group-item p-3 d-flex align-items-start gap-3"
                            style={{
                              backgroundColor: isRead ? '#F1F3F5' : '#FFFFFF',
                              cursor: isRead ? 'default' : 'pointer',
                              transition: 'background-color 0.2s ease'
                            }}
                            onClick={() => {
                              if (!isRead) {
                                setNotifications(prev => prev.map(item => item.id === n.id ? { ...item, unread: false, isRead: true, readStatus: 'READ' } : item));
                              }
                            }}
                          >
                            <div className="pt-0.5">
                              {isRead ? (
                                <i className="bi bi-bell text-secondary fs-5" style={{ color: '#868E96' }}></i>
                              ) : (
                                <i className="bi bi-bell-fill text-success fs-5"></i>
                              )}
                            </div>
                            <div className="flex-grow-1 min-w-0">
                              <div className="d-flex justify-content-between align-items-baseline gap-2 mb-1">
                                <h6
                                  className={`mb-1 fw-bold ${isRead ? 'text-muted' : 'text-dark'}`}
                                  style={{ color: isRead ? '#495057' : '#0F172A' }}
                                >
                                  {n.title}
                                </h6>
                                <small style={{ color: isRead ? '#868E96' : '#64748B' }}>{n.time}</small>
                              </div>
                              <p
                                className="mb-2 small"
                                style={{ color: isRead ? '#6C757D' : '#334155', lineHeight: '1.45' }}
                              >
                                {n.message}
                              </p>
                              <div className="d-flex justify-content-between align-items-center pt-1 border-top border-light-subtle">
                                {isRead ? (
                                  <span className="badge bg-light border text-secondary rounded-pill px-2 py-0.5" style={{ fontSize: '0.72rem', color: '#6C757D' }}>
                                    <i className="bi bi-check2 me-1"></i> Read
                                  </span>
                                ) : (
                                  <div className="d-flex align-items-center gap-2">
                                    <span className="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2 py-0.5" style={{ fontSize: '0.72rem' }}>
                                      ● Unread
                                    </span>
                                    <button
                                      type="button"
                                      className="btn btn-sm btn-link text-primary text-decoration-none p-0 fw-semibold"
                                      style={{ fontSize: '0.78rem' }}
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        setNotifications(prev => prev.map(item => item.id === n.id ? { ...item, unread: false, isRead: true, readStatus: 'READ' } : item));
                                      }}
                                    >
                                      Read Message
                                    </button>
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* Module 14: Backups */}
              {activeTab === 'backups' && (
                <div>
                  <div className="page-header">
                    <div>
                      <h2>14. Database Backup & Disaster Recovery</h2>
                      <p>Automated daily backups, manual triggers, retention, and SHA-256 checksums.</p>
                    </div>
                    <button className="btn btn-navy" onClick={handleTriggerBackup}>
                      <i className="bi bi-cloud-arrow-up me-1"></i> Trigger Manual Backup
                    </button>
                  </div>
                  <div className="card-portal">
                    <div className="table-responsive">
                      <table className="table table-portal">
                        <thead>
                          <tr>
                            <th>Snapshot File Name</th>
                            <th>Type</th>
                            <th>Size</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Timestamp</th>
                          </tr>
                        </thead>
                        <tbody>
                          {backups.map(b => (
                            <tr key={b.id}>
                              <td className="fw-bold">{b.fileName}</td>
                              <td><span className="badge bg-secondary-subtle text-secondary">{b.type}</span></td>
                              <td>{b.size}</td>
                              <td><code>{b.location}</code></td>
                              <td><span className="badge-status approved">{b.status}</span></td>
                              <td>{b.date}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* Module 15: Users & Permissions */}
              {activeTab === 'users' && (
                <div>
                  <div className="page-header">
                    <div>
                      <h2>15. User & Permission Management</h2>
                      <p>Role-based access matrix, security administration, and audit logs.</p>
                    </div>
                  </div>
                  <div className="card-portal mb-4">
                    <div className="card-header-portal">
                      <h5>System User Directory</h5>
                    </div>
                    <div className="table-responsive">
                      <table className="table table-portal">
                        <thead>
                          <tr>
                            <th>User Name</th>
                            <th>Email</th>
                            <th>Assigned Role</th>
                            <th>Department</th>
                            <th>Status</th>
                          </tr>
                        </thead>
                        <tbody>
                          {INITIAL_USERS.map(u => (
                            <tr key={u.id}>
                              <td className="fw-bold">{u.name}</td>
                              <td>{u.email}</td>
                              <td><span className="badge bg-primary-subtle text-primary border">{u.role}</span></td>
                              <td>{u.dept}</td>
                              <td><span className="badge-status approved">ACTIVE</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="card-portal">
                    <div className="card-header-portal">
                      <h5>Security Audit Trail</h5>
                    </div>
                    <div className="table-responsive">
                      <table className="table table-portal">
                        <thead>
                          <tr>
                            <th>Timestamp</th>
                            <th>Actor</th>
                            <th>Action</th>
                            <th>Entity</th>
                            <th>Entity ID</th>
                            <th>IP Address</th>
                          </tr>
                        </thead>
                        <tbody>
                          {auditLogs.map(l => (
                            <tr key={l.id}>
                              <td>{l.timestamp}</td>
                              <td className="fw-bold">{l.actor}</td>
                              <td><span className="badge bg-light text-dark border">{l.action}</span></td>
                              <td>{l.entity}</td>
                              <td><code>{l.entityId}</code></td>
                              <td>{l.ip}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* Module 01: Login View */}
              {activeTab === 'login' && (
                <div className="py-2">
                  <div className="alert d-flex justify-content-between align-items-center mb-3" style={{ background: '#0a1e10', color: '#84d623', border: '1px solid rgba(132, 214, 35, 0.3)' }}>
                    <div>
                      <strong><i className="bi bi-shield-lock-fill me-2"></i>ATS URJA Corporate Authentication Screen</strong>
                      <div className="small text-light opacity-75">Urja Foods & Agro Applicant Tracking System live sign-in portal.</div>
                    </div>
                    <button className="btn btn-sm btn-outline-light" onClick={() => setIsAuthenticated(false)}>
                      Go Fullscreen
                    </button>
                  </div>
                  <div style={{ borderRadius: 18, overflow: 'hidden', border: '1px solid rgba(132, 214, 35, 0.25)' }}>
                    <UrjaLoginPage onLoginSuccess={handleLoginSuccess} initialEmail={currentUser.email} />
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* MODAL: Requisition Creation */}
          {showReqModal && (
            <div className="modal show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }}>
              <div className="modal-dialog modal-lg">
                <div className="modal-content">
                  <div className="modal-header">
                    <h5 className="modal-title fw-bold">Create New Manpower Requisition</h5>
                    <button type="button" className="btn-close" onClick={() => setShowReqModal(false)}></button>
                  </div>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const newReq = {
                      id: requisitions.length + 1,
                      code: `REQ-2026-00${requisitions.length + 1}`,
                      title: formData.get('jobTitle'),
                      deptName: formData.get('deptName'),
                      headcount: parseInt(formData.get('headcount')),
                      type: formData.get('type'),
                      priority: formData.get('priority'),
                      budgetMin: `${formData.get('budgetMin')} LPA`,
                      budgetMax: `${formData.get('budgetMax')} LPA`,
                      status: 'PENDING_HR_REVIEW',
                      createdBy: currentUser.name,
                      assignedRecruiter: null,
                      tatStartDate: null,
                      dueDate: null
                    };
                    setRequisitions([newReq, ...requisitions]);
                    setShowReqModal(false);
                    showToast(`Requisition ${newReq.code} created and routed for HR review!`);
                  }}>
                    <div className="modal-body">
                      <div className="row g-3">
                        <div className="col-md-8">
                          <label className="form-label small fw-bold">Job Title</label>
                          <input name="jobTitle" className="form-control" placeholder="e.g. Senior Security Architect" required />
                        </div>
                        <div className="col-md-4">
                          <label className="form-label small fw-bold">Headcount</label>
                          <input name="headcount" type="number" min="1" className="form-control" defaultValue="1" required />
                        </div>
                        <div className="col-md-6">
                          <label className="form-label small fw-bold">Department</label>
                          <select name="deptName" className="form-select">
                            {departments.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
                          </select>
                        </div>
                        <div className="col-md-3">
                          <label className="form-label small fw-bold">Position Type</label>
                          <select name="type" className="form-select">
                            <option value="NEW_HEADCOUNT">New Headcount</option>
                            <option value="REPLACEMENT">Replacement</option>
                          </select>
                        </div>
                        <div className="col-md-3">
                          <label className="form-label small fw-bold">Priority</label>
                          <select name="priority" className="form-select">
                            <option value="CRITICAL">Critical</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                          </select>
                        </div>
                        <div className="col-md-6">
                          <label className="form-label small fw-bold">Min Budget (LPA)</label>
                          <input name="budgetMin" type="number" className="form-control" defaultValue="15" required />
                        </div>
                        <div className="col-md-6">
                          <label className="form-label small fw-bold">Max Budget (LPA)</label>
                          <input name="budgetMax" type="number" className="form-control" defaultValue="22" required />
                        </div>
                        <div className="col-12">
                          <label className="form-label small fw-bold">Business Justification</label>
                          <textarea name="justification" className="form-control" rows="2" placeholder="Explain the rationale for this hiring request" required></textarea>
                        </div>
                      </div>
                    </div>
                    <div className="modal-footer">
                      <button type="button" className="btn btn-light" onClick={() => setShowReqModal(false)}>Cancel</button>
                      <button type="submit" className="btn btn-navy">Submit for HR Review</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: Approval Decision */}
          {showApprovalModal && selectedReqForApproval && (
            <div className="modal show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }}>
              <div className="modal-dialog">
                <div className="modal-content">
                  <div className="modal-header">
                    <h5 className="modal-title fw-bold">Approval Review: {selectedReqForApproval.code}</h5>
                    <button type="button" className="btn-close" onClick={() => setShowApprovalModal(false)}></button>
                  </div>
                  <form onSubmit={handleProcessApproval}>
                    <div className="modal-body">
                      <div className="mb-3">
                        <div className="fw-bold">{selectedReqForApproval.title}</div>
                        <div className="text-muted small">Department: {selectedReqForApproval.deptName} • Priority: {selectedReqForApproval.priority}</div>
                      </div>
                      <div className="mb-3">
                        <label className="form-label small fw-bold">Approval Decision</label>
                        <select className="form-select" value={approvalDecision} onChange={(e) => setApprovalDecision(e.target.value)}>
                          <option value="APPROVED">Approve (Advance to Next Stage)</option>
                          <option value="RETURNED_FOR_CORRECTION">Return for Correction</option>
                          <option value="REJECTED">Reject Requisition</option>
                        </select>
                      </div>
                      <div className="mb-3">
                        <label className="form-label small fw-bold">Remarks / Justification Notes</label>
                        <textarea className="form-control" rows="3" value={approvalRemarks} onChange={(e) => setApprovalRemarks(e.target.value)} placeholder="Provide mandatory rationale for your decision..."></textarea>
                      </div>
                    </div>
                    <div className="modal-footer">
                      <button type="button" className="btn btn-light" onClick={() => setShowApprovalModal(false)}>Cancel</button>
                      <button type="submit" className="btn btn-navy">Confirm Action</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: Recruiter Assignment */}
          {showAssignModal && selectedReqForAssign && (
            <div className="modal show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }}>
              <div className="modal-dialog">
                <div className="modal-content">
                  <div className="modal-header">
                    <h5 className="modal-title fw-bold">Assign Recruiter: {selectedReqForAssign.code}</h5>
                    <button type="button" className="btn-close" onClick={() => setShowAssignModal(false)}></button>
                  </div>
                  <form onSubmit={handleAssignRecruiter}>
                    <div className="modal-body">
                      <div className="alert alert-info small">
                        <i className="bi bi-info-circle-fill me-1"></i>
                        Assigning a recruiter automatically starts the <strong>30 Calendar Days TAT SLA clock</strong>.
                      </div>
                      <div className="mb-3">
                        <label className="form-label small fw-bold">Select Dedicated Recruiter</label>
                        <select className="form-select" value={selectedRecruiterId} onChange={(e) => setSelectedRecruiterId(e.target.value)}>
                          <option value="3">Anita Deshmukh (Lead Recruiter - Engineering)</option>
                          <option value="4">Rahul Nair (Senior Recruiter - Technical)</option>
                        </select>
                      </div>
                    </div>
                    <div className="modal-footer">
                      <button type="button" className="btn btn-light" onClick={() => setShowAssignModal(false)}>Cancel</button>
                      <button type="submit" className="btn btn-navy">Confirm Assignment & Start TAT</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TalentPulsePortal />);
  </script>
</body>

</html>
